name: Validate MegasMoves HQ marketing site

on:
  push:
    branches:
      - main
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build marketing pages only
        run: npm run build
      - name: Check project-site preview asset paths
        run: |
          grep -q '/megasmoves/_next/' out/index.html
          grep -q '/megasmoves/megas-logo.png' out/index.html
      - name: Build custom-domain root variant
        env:
          MEGAS_PAGES_BASE_PATH: ""
          NEXT_PUBLIC_MEGAS_PAGES_BASE_PATH: ""
        run: npm run build
      - name: Check custom-domain asset paths
        run: |
          grep -q '/_next/' out/index.html
          grep -q '/megas-logo.png' out/index.html
          if grep -q '/megasmoves/_next/' out/index.html || grep -q '/megasmoves/megas-logo.png' out/index.html; then
            echo "Custom-domain build unexpectedly contains project-site asset prefixes"
            exit 1
          fi
      - name: Verify exported public routes
        shell: bash
        run: |
          for route in index.html docs/index.html docs/getting-started/index.html docs/cli-reference/index.html docs/product-plans/index.html pricing/index.html wow/index.html download/index.html legal/index.html privacy/index.html terms/index.html; do
            test -f "out/$route" || { echo "Missing: out/$route"; exit 1; }
          done
          if grep -R -E -l 'Megas Monitor|Megas Operate|Megas Secure|₹999|₹1,999|₹4,999|₹9,999' out --include='*.html'; then
            echo "Obsolete marketing tier appeared in exported page"
            exit 1
          fi
