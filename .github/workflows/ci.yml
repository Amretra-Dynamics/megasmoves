name: MegasMoves Python and source integrity
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: megasmoves-python-main
  cancel-in-progress: true
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q worker/megas
      - run: python tools/release_guard.py --scope both
  python-distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s worker/tests -p test_pypi_operator.py -v
      - run: megas --version
      - run: megas --help
      - run: python -m pip wheel --no-deps -w dist .
