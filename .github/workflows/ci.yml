name: MegasMoves integration checks
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q worker/megas
      - run: python tools/release_guard.py --scope both

  native-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S worker/windows/native -B build/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure

  linux-gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev
      - run: cmake -S worker/linux/MegasMoves.GtkApp -B build/linux-gtk -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/linux-gtk --parallel

  windows-native-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build worker/windows/MegasMoves.WinUI/MegasMoves.WinUI.csproj --configuration Release -p:Platform=x64 --verbosity minimal
