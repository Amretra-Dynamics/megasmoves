name: Deploy HQ MegasMoves marketing website

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - name: Configure GitHub Pages and discover published base path
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - name: Export marketing, docs, pricing and legal
        env:
          MEGAS_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_MEGAS_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Verify marketing export
        run: |
          test -f out/index.html
          test -f out/docs/index.html
          test -f out/pricing/index.html
          test -f out/wow/index.html
          test -f out/legal/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
